global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:8001']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  
  - job_name: order
    static_configs:
      - targets: ['order:8002']

  - job_name: 'notification'
    static_configs:
      - targets: ['notification:8003']
