apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: ticketmei
spec:
  # A single writer owns notifications_log.json.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      automountServiceAccountToken: false
      containers:
        - name: notification
          image: ticketmei-notification:local
          ports:
            - name: metrics
              containerPort: 8003
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notification-data
