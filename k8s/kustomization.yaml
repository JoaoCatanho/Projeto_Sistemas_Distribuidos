- name: ticketmei-catalog
  newName: ghcr.io/joaocatanho/ticketmei-catalog
  newTag: c5f17ba458ccb46526c292db8718b414737a2b5b
- name: ticketmei-notification
  newName: ghcr.io/joaocatanho/ticketmei-notification
  newTag: c5f17ba458ccb46526c292db8718b414737a2b5b
- name: ticketmei-order
  newName: ghcr.io/joaocatanho/ticketmei-order
  newTag: c5f17ba458ccb46526c292db8718b414737a2b5b
- name: ticketmei-payment
  newName: ghcr.io/joaocatanho/ticketmei-payment
  newTag: c5f17ba458ccb46526c292db8718b414737a2b5b
