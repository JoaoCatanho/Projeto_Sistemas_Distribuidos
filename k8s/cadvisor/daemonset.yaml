apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: ticketmei
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      automountServiceAccountToken: false
      hostPID: true
      # Include the control-plane node of the local Docker Desktop cluster.
      tolerations:
        - operator: Exists
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          args:
            - --housekeeping_interval=10s
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: runtime
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: containerd
              mountPath: /var/lib/containerd
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: runtime
          hostPath:
            path: /var/run
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: containerd
          hostPath:
            path: /var/lib/containerd
            type: Directory
