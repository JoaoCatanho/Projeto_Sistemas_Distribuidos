apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketmei
spec:
  # ORDERS is currently stored in the application's memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      automountServiceAccountToken: false
      containers:
        - name: order
          image: ticketmei-order:local
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
          # The current Order application does not expose /metrics.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
