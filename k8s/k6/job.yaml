apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: ticketmei
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: k6
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: [run, /scripts/load-test.js]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
