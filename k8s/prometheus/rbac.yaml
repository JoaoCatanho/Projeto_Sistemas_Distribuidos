apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ticketmei
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: ticketmei
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: ticketmei
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ticketmei
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
