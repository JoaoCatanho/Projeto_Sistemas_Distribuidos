apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ticketmei
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: api-gateway
        static_configs:
          - targets: ['api-gateway:8000']
      - job_name: catalog
        static_configs:
          - targets: ['catalog:8001']
      - job_name: notification
        static_configs:
          - targets: ['notification:8003']
      - job_name: rabbitmq
        static_configs:
          - targets: ['rabbitmq:15692']
      # Order currently has no /metrics endpoint. Add a scrape job after
      # instrumenting the application; scraping port 8002 now returns 404.
      - job_name: cadvisor
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [ticketmei]
            selectors:
              - role: pod
                label: app=cadvisor
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
