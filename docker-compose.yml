networks:
  ticketmei-net:
    driver: bridge

services:
  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "8001:8001"
    networks:
      - ticketmei-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      CATALOG_URL: http://catalog:8001
      ORDER_URL: http://order:8002
    ports:
      - "8000:8000"
    depends_on:
      - catalog
      - order
    networks:
      - ticketmei-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ticketmei-net

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    volumes: # acrescentei o volume para provisionamento do datasource e dashboard
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dasboard1.json:/var/lib/grafana/dashboards/dasboard1.json
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - ticketmei-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ticketmei-net
  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    user: root
    working_dir: /ci-scripts
    volumes:
      - ./k6:/ci-scripts
    command: run load-test.js
    depends_on:
      - api-gateway
    networks:
      - ticketmei-net
    profiles:
      - testing
  order:
    build: ./order
    container_name: order
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/ticketmei
    ports:
      - "8002:8002"
    depends_on:
      - catalog
      - rabbitmq
    networks:
      - ticketmei-net
  notification:
    build: ./notification
    container_name: notification
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/ticketmei
    volumes:
      - ./notification/data:/app/data
    depends_on:
      - rabbitmq
    networks:
      - ticketmei-net
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_VHOST: ticketmei
    ports:
      - "5672:5672" # onde os serviços se conectam
      - "15672:15672" # página web de administração
      - "15692:15692" # porta para o Prometheus coletar métricas
    networks:
      - ticketmei-net
