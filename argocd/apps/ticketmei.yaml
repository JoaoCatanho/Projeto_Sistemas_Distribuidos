apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketmei
  namespace: argocd
spec:
  project: ticketmei
  source:
    repoURL: https://github.com/JoaoCatanho/Projeto_Sistemas_Distribuidos.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketmei
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
