name: ci

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "k8s/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway: api-gateway/**
            catalog: catalog/**
            order: order/**
            notification: notification/**

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/joaocatanho/ticketmei-${{ matrix.service }}:${{ github.sha }}
          
  update-manifests:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Update image tags in k8s
        run: |
          cd k8s
          for service in $(echo '${{ needs.changes.outputs.services }}' | jq -r '.[]'); do
            kustomize edit set image ticketmei-$service=ghcr.io/joaocatanho/ticketmei-$service:${{ github.sha }}
          done
          cat kustomization.yaml
      -
        name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "Atualiza imagens para ${{ github.sha }} [skip ci]" || exit 0
          git pull --rebase
          git push